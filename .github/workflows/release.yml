name: Release

# Source pushes only run checks. A version tag explicitly starts a release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Package five server builds
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          go mod download
      - name: Build embedded web interface and server
        run: make build
      - name: Package archives and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 scripts/release.py "$RELEASE_TAG"
      - name: Save release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: bundle/releases/${{ github.ref_name }}/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign release checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Configure owner-only main/v* rulesets and a tag-only environment before storing the key.
    environment: release-signing
    steps:
      - name: Check out approved signing source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag on approved source history
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
      - name: Set up Go without shared build caches
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile trusted signer without credentials
        run: go build -trimpath -o "$RUNNER_TEMP/release-signer" ./scripts/release-signing
      - name: Download unsigned packages as data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: unsigned
      - name: Prepare signature output
        run: mkdir signatures
      - name: Sign checksums
        env:
          SHELLPORT_RELEASE_SIGNING_KEY: ${{ secrets.SHELLPORT_RELEASE_SIGNING_KEY }}
        run: '"$RUNNER_TEMP/release-signer" --checksums unsigned/SHA256SUMS --output signatures'
      - name: Save release signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          path: signatures/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build, sign]
    # Every release, including beta and RC tags, requires successful signing.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release
      - name: Download release signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signatures
          path: release
      - name: Verify archive checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Verify release signature
        working-directory: release
        run: openssl pkeyutl -verify -pubin -inkey shellport-release-key.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
      - name: Create release with all five builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=(--verify-tag --notes-file release/RELEASE_NOTES.md --title "Shellport $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          shopt -s nullglob
          assets=(release/*.tar.gz release/SHA256SUMS release/*.sig release/*.pem)
          gh release create "$RELEASE_TAG" "${assets[@]}" "${options[@]}"
